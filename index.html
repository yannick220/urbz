async function ignFetch(b){

   return{fs,swapped:Math.abs(p[0]-cx)+Math.abs(p[1]-cy)>Math.abs(p[1]-cx)+Math.abs(p[0]-cy)};
  }catch(e){console.warn('URBZ IGN',e.message)}

// Recherche : géolocalisation d'un bâtiment nommé, sans liste de résultats.
const SEARCH_CACHE_KEY='urbz-index-noms-v1';
let searchIndex=readJSON(SEARCH_CACHE_KEY,{}),searchTimer=null,searchSequence=0;
function normalizedSearch(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function buildingMidpoint(group){
 const polygons=group?.geometry?.coordinates||[];
 let minLon=Infinity,minLat=Infinity,maxLon=-Infinity,maxLat=-Infinity;
 for(const poly of polygons)for(const ring of poly)for(const p of ring){
  if(!Array.isArray(p)||p.length<2)continue;
  minLon=Math.min(minLon,p[0]);maxLon=Math.max(maxLon,p[0]);
  minLat=Math.min(minLat,p[1]);maxLat=Math.max(maxLat,p[1]);
 }
 return Number.isFinite(minLon)?[(minLon+maxLon)/2,(minLat+maxLat)/2]:null;
}
function rememberNamedPositions(){
 let changed=false;
 for(const [id,group] of buildings){
  const kind=knownKind(id)||cardRecords[id]?.kind;
  if(!kind)continue;
  const point=buildingMidpoint(group);
  if(point){
   searchIndex[kind]={name:CARD_KINDS[kind]||kind,lon:point[0],lat:point[1],id};
   changed=true;
  }
 }
 if(changed)try{localStorage.setItem(SEARCH_CACHE_KEY,JSON.stringify(searchIndex))}catch{}
}
function searchCandidates(){
 // Ne répertorier que les véritables cartes nommées, pas les milliers de « Bâtiment X ».
 const records=new Map();
 for(const [id,group] of buildings){
  const kind=knownKind(id)||cardRecords[id]?.kind;
  if(!kind)continue;
  const point=buildingMidpoint(group);
  if(!point)continue;
  records.set(kind,{key:kind,name:CARD_KINDS[kind]||kind,point,id,category:categoryOf(id),ready:true});
 }
 for(const [kind,entry] of Object.entries(searchIndex)){
  if(records.has(kind)||!Number.isFinite(entry.lon)||!Number.isFinite(entry.lat))continue;
  records.set(kind,{key:kind,name:entry.name||CARD_KINDS[kind]||kind,point:[entry.lon,entry.lat],id:entry.id||null,category:FIXED_CATEGORIES[kind]||'habitat',ready:false});

function searchMatches(query){

  const name=normalizedSearch(item.name),words=name.split(' ');

  return {...item,score};
 }).filter(item=>item.score>0).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'fr'));

 if(status)status.textContent=normalizedSearch(searchTerm).length<3?'':matches.length===0?'Aucun bâtiment répertorié pour cette recherche.':matches.length===1?'1 bâtiment trouvé · toucher pour afficher':matches.length+' bâtiments trouvés';

function findBuildingByKind(kind,point){

  if(knownKind(id)!==kind&&cardRecords[id]?.kind!==kind)continue;
  const pos=buildingMidpoint(group);if(!pos)continue;
  const d=Math.hypot((pos[0]-point[0])*111320*Math.cos(point[1]*Math.PI/180),(pos[1]-point[1])*111320);

function cachedPositionForBuilding(id){

  const entry=code?searchIndex[code]:null;
  if(entry&&Number.isFinite(entry.lon)&&Number.isFinite(entry.lat))return [entry.lon,entry.lat];

function selectForArrival(item){

function travelToBuilding(item){

 const input=$('searchInput');if(input)input.blur();
 // Invalidate the previous selection so an old card can never open at arrival.
 if(selectedId)selectedId=null;
 const hasGeometry=selectForArrival(item);
 if(!hasGeometry){persist();paint();}
 closeSheet();
 const offset=[0,-Math.round(map.getContainer().clientHeight*.14)];
 map.flyTo({center:item.point,zoom:18.15,bearing:map.getBearing(),pitch:58,offset,duration:1600,essential:true});

 // bottom card until the target group is actually ready and colored.

  if(token!==travelToken||arrivalStarted)return;
  arrivalStarted=true;
  refreshViewport();
  const started=Date.now();
  const finish=()=>{
   if(token!==travelToken)return;
   // Re-resolve following tile updates and changed connected-group IDs.
   if(!selectedId||!buildings.has(selectedId))selectForArrival(item);
   if(selectedId&&buildings.has(selectedId)){
    const position=buildingMidpoint(buildings.get(selectedId));
    // Do not show a different selected building if mapping is stale.
    if(position&&Math.hypot((position[0]-item.point[0])*111320*Math.cos(item.point[1]*Math.PI/180),(position[1]-item.point[1])*111320)<350){
     paint();openSheet('building');return;
    }
   }
   if(Date.now()-started<14000){setTimeout(finish,350);return}
   toast('Bâtiment localisé. Les données détaillées ne sont pas encore disponibles.',5);
  };

 };

function profileAvatarInner(){return profilePhoto?`<img src="${profilePhoto}" alt="" style="width:100%;height:100%;object-fit:cover">`:'UR'}
function refreshAvatar(){const el=$('avatarImage');el.hidden=!profilePhoto;if(profilePhoto)el.src=profilePhoto;$('avatarInitial').hidden=!!profilePhoto}
function myRanking(){const count=FAKE_RANKS.filter(([,worth])=>worth>netWorth()).length;return count+1}
function renderSheet(){
 const content=$('sheetContent');
 content.innerHTML=view==='building'?renderBuilding():view==='market'?renderMarket():view==='profile'?renderProfile():view==='wallet'?renderWallet():view==='ranking'?renderRanking():view==='search'?renderSearch():'';
 const title=content.querySelector('.sheet-heading');
 if(title)title.classList.add('fixed-sheet-title');
 const filter=(view==='market')?content.querySelector('.pillrow'):null;
 if(filter)filter.classList.add('market-floating-filters');
 const scroll=document.createElement('div');scroll.className='sheet-scroll';
 for(const node of [...content.childNodes])if(node!==title&&node!==filter)scroll.appendChild(node);
 content.appendChild(scroll);
 if(filter)content.appendChild(filter);
 attachSheetActions();
}

// Le bord inférieur du cartouche reste ancré : la fiche grandit vers le haut.
// Aucun remplacement DOM lors du clic : les deux mouvements sont réversibles.
function setBuildingExpansion(open,animate=true){
 if(view!=='building')return;
 const sheet=$('sheet');
 const button=$('expandBtn');
 const details=$('evolutionDetails');
 if(!button||!details)return;
 const scroll=$('sheetContent').querySelector('.sheet-scroll');
 const chevron=$('evolutionChevron');
 const deviceHeight=$('phone')?.getBoundingClientRect().height||window.innerHeight;
 // Compensation de l'espace qu'occupent la courbe et les deux indicateurs.
 // On garde toujours la base du panneau au bas de l'écran.
 const normalHeight=deviceHeight/3;
 const additionalHeight=details.scrollHeight+18;
 // L'en-tête est désormais fixe et ne fait plus partie de la zone défilante.
 // On réserve la place nécessaire pour le garder visible avec la valeur,
 // le graphique, les deux indices et l'action d'achat/revente.
 const heading=$('sheetContent').querySelector('.building-header');
 const headerHeight=heading?.getBoundingClientRect().height||72;
 const collapsedContentHeight=scroll?scroll.scrollHeight:normalHeight;
 const requiredHeight=headerHeight+collapsedContentHeight+additionalHeight+30;
 const expandedHeight=Math.min(deviceHeight*.92,Math.max(normalHeight+additionalHeight+headerHeight,requiredHeight));
 sheet.style.setProperty('--building-expanded-height',expandedHeight+'px');
 button.setAttribute('aria-expanded',String(open));
 if(chevron)chevron.textContent=open?'expand_less':'expand_more';
 if(animate===false){sheet.classList.add('no-building-transition')}
 sheet.classList.toggle('building-expanded',open);
 if(scroll){
   // Ne jamais faire défiler jusqu'en bas : cela cachait le nom du bâtiment.
   // L'agrandissement du panneau absorbe le contenu. Le défilement reste
   // manuel uniquement si l'écran du téléphone est trop petit.
   scroll.scrollTop=0;
 }
 if(!animate)requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.remove('no-building-transition')));
}
function attachSheetActions(){const c=$('sheetContent');
 c.querySelector('#toggleMyBuildings')?.addEventListener('click',()=>{showMyBuildings=!showMyBuildings;try{localStorage.setItem('urbz-mes-batiments-actif-v1',JSON.stringify(showMyBuildings))}catch{};paint();renderSheet()});
 c.querySelector('#closeSheet')?.addEventListener('click',()=>{if(view==='building'){selectedId=null;persist();paint()}closeSheet()});
 c.querySelector('#expandBtn')?.addEventListener('click',()=>{
  expanded=!expanded;
  setBuildingExpansion(expanded,true);
 });
 c.querySelector('#tradeBtn')?.addEventListener('click',()=>{if(!selectedId)return;const price=currentValue(selectedId);if(ownerFor(selectedId)){economy.balance+=price;delete economy.owned[selectedId];toast('Vente enregistrée : +'+money(price))}else{if(economy.balance<price){toast('Crédits insuffisants.',5);return}economy.balance-=price;economy.owned[selectedId]={boughtAt:price,turn:economy.turn};toast('Bâtiment acheté · '+money(price))}saveEconomy();renderSheet()});
 c.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const id=b.dataset.filter;if(marketFilters.has(id))marketFilters.delete(id);else marketFilters.add(id);c.querySelectorAll('[data-filter]').forEach(p=>{const active=marketFilters.has(p.dataset.filter);p.classList.toggle('active',active);p.setAttribute('aria-pressed',String(active))});const list=c.querySelector('.sheet-scroll .list')||c.querySelector('.list');if(list)list.innerHTML=marketRows()});
 c.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
 c.querySelectorAll('[data-building]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.building;
  const group=buildings.get(id);
  // Same animated journey as tapping a search result.
  const point=group?buildingMidpoint(group):cachedPositionForBuilding(id);
  if(!point){toast('La position de ce bâtiment n’est pas encore disponible.',4);return}
  travelToBuilding({id,key:knownKind(id)||cardRecords[id]?.kind||null,point,name:kindName(id),category:categoryOf(id)});
 });
 c.querySelector('#searchInput')?.addEventListener('input',e=>scheduleBuildingSearch(e.target.value));
 c.querySelector('#searchInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitBuildingSearch()}});
}
$('veil').onclick=()=>{if(view==='building'){selectedId=null;persist();paint()}closeSheet()};
$('openProfile').onclick=()=>navigate('profile');
$('openRanking').onclick=()=>navigate('ranking');
$('toggleMarketView').onclick=toggleMarketView;$('openWallet').onclick=()=>navigate('wallet');
[['openMarket','Marché'],['openWallet','Mes biens'],['openRanking','Classement'],['toggleMarketView','Valeurs']].forEach(([id,t])=>{const b=$(id);if(b){const l=document.createElement('span');l.className='lbl';l.textContent=t;b.appendChild(l)}});
{const hud=document.querySelector('.top-title');hud.removeAttribute('aria-hidden');hud.innerHTML='<div class="pill-hud"><i class="coin">ε</i><b id="hudBal"></b></div><small id="hudNet"></small>';
 const fmt=n=>Math.round(n).toLocaleString('fr-FR');window.refreshHUD=()=>{$('hudBal').textContent=fmt(economy.balance);$('hudNet').textContent='Patrimoine · '+fmt(netWorth())+' ε'};refreshHUD();setInterval(refreshHUD,800)}
$('openMarket').onclick=()=>navigate('market');
$('openSearch').onclick=()=>{
 searchTerm='';
 clearTimeout(searchFocusTimer);
 navigate('search');
 renderSearchResults([]);
 const input=$('searchInput');
 if(input){
  searchFocusTimer=setTimeout(()=>{
   if(view==='search' && input.isConnected && document.activeElement!==input){
    try{input.focus({preventScroll:true})}catch{input.focus()}
   }
  },470);
 }
};
$('gps').onclick=()=>{closeSheet();map.flyTo({center:DEMO_CENTER,zoom:17,bearing:-27,pitch:58,duration:1050})};
refreshAvatar();
let startY=null;$('dragHandle').addEventListener('pointerdown',e=>{startY=e.clientY;$('dragHandle').setPointerCapture(e.pointerId)});$('dragHandle').addEventListener('pointerup',e=>{if(startY===null)return;const d=e.clientY-startY;startY=null;if(d>72){if(view==='building'){selectedId=null;persist();paint()}closeSheet()}else if(d< -65&&view==='building'){expanded=true;openSheet('building')}else if(d>32&&view==='building'&&expanded){expanded=false;openSheet('building')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(view==='building'){selectedId=null;persist();paint()}closeSheet()}});
</script></main></body></html>
