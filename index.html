 --urbz-surface:#1E2732;
 --urbz-surface-2:#252F3C;
 --urbz-border:#323F4D;
 --urbz-text:#F3F5F9;
 --urbz-secondary:#AAB5C3;
 --urbz-accent:#8CBCEB;
 color:var(--urbz-text)!important;
 background:var(--urbz-panel)!important;
 color-scheme:dark;
 border:1px solid #303A4533;
 box-shadow:0 -18px 65px #080C14A8;
 backdrop-filter:none;
}
.sheet .sheet-content,.sheet .sheet-scroll,.sheet .sheet-heading,
.sheet .fixed-sheet-title,.sheet .market-floating-filters{
 background:var(--urbz-panel)!important;
 background-image:none!important;
 color:var(--urbz-text)!important;
 backdrop-filter:none!important;
 box-shadow:none!important;
}
.sheet .fixed-sheet-title{
 border-bottom:0!important;
 isolation:isolate;
}
.sheet .sheet-heading h2,.sheet .headcopy h2,.sheet .section-label,
.sheet .search-match .search-name,.sheet .price,.sheet .profilehero strong,
.sheet .listitem strong,.sheet .listitem .amount,.sheet .urbz-mybuildings-card strong{
 color:var(--urbz-text)!important;
}
.sheet .muted,.sheet .tiny,.sheet .eyebrow,.sheet .price-label,
.sheet .profile-stats span,.sheet .stat p,.sheet .listitem small,
.sheet .search-match .search-family,.sheet .search-status,
.sheet .urbz-mybuildings-card small,.sheet .alert,.sheet .fakelabel{
 color:var(--urbz-secondary)!important;
}
.sheet .elevated,.sheet .list,.sheet .listitem,
.sheet .urbz-mybuildings-card,.sheet .urbz-value,.sheet .urbz-evolution,
.sheet .stat,.sheet .editbox,.sheet .alert,.sheet .fakelabel{
 color:var(--urbz-text)!important;
 background:var(--urbz-surface)!important;
 border-color:var(--urbz-border)!important;
 box-shadow:none!important;
}
.sheet .listitem{
 border:0!important;
 border-bottom:1px solid var(--urbz-border)!important;
}
.sheet .listitem:last-child{border-bottom:none!important}
.sheet .listitem:active{background:var(--urbz-surface-2)!important}
.sheet .listitem[style*="background"]{background:#243648!important}
.sheet .profile-stats b{color:var(--urbz-text)!important}
.sheet .hero-line{border-color:var(--urbz-border)!important}
.sheet .ranknumber{color:#95C5FF!important}
.sheet .chart{color:#8CBCEB}
.sheet .urbz-evolution-head{color:var(--urbz-text)}
.sheet .btn.soft,.sheet .btn.line,.sheet .pill{
 background:var(--urbz-surface)!important;
 border:1px solid var(--urbz-border)!important;
 color:var(--urbz-text)!important;
}
.sheet .pill.active{
 background:#D9EAFE!important;
 border-color:#D9EAFE!important;
 color:#151D26!important;
}
.sheet .market-floating-filters .pill.active[data-filter="loisirs"]{background:#D6AF56!important;border-color:#D6AF56!important;color:#251B08!important}
.sheet .market-floating-filters .pill.active[data-filter="habitat"]{background:#8CBCEB!important;border-color:#8CBCEB!important;color:#12283D!important}
.sheet .market-floating-filters .pill.active[data-filter="services"]{background:#EFA1A3!important;border-color:#EFA1A3!important;color:#421D22!important}
.sheet .market-floating-filters .pill.active[data-filter="public"]{background:#A9A0E8!important;border-color:#A9A0E8!important;color:#251D4C!important}
.sheet .market-floating-filters{
 border:0!important;
 padding-top:13px!important;
 box-shadow:none!important;
}
.sheet .urbz-toggle{background:#3D4958!important}
.sheet .urbz-toggle.on{background:#669ACB!important}
.sheet .urbz-toggle span{background:#F5F8FD!important}
.sheet .sheet-handle:before{background:#5A6675!important}
.sheet .building-marker{box-shadow:0 0 0 4px var(--urbz-panel)!important}
.sheet .sheet-search,.sheet .editbox input,.sheet .editbox select{
 color:var(--urbz-text)!important;
 background:var(--urbz-surface)!important;
 border-color:var(--urbz-border)!important;
 caret-color:#A5CEFF;
}
.sheet .sheet-search::placeholder{color:#8996A5;opacity:1}
.sheet.searchsheet .search-title{
 color:var(--urbz-text)!important;
 background:var(--urbz-surface)!important;
 border-color:var(--urbz-border)!important;
}
.sheet.searchsheet .search-title .sheet-search{
 background:transparent!important;
 border:0!important;
}
.sheet.searchsheet .search-title .material-symbols-rounded{color:#AAB5C3!important}
.sheet.searchsheet .search-results{background:var(--urbz-panel)!important}
.sheet.searchsheet .search-match{
 background:var(--urbz-surface)!important;
 color:var(--urbz-text)!important;
 border-color:var(--urbz-border)!important;
}
.sheet.searchsheet .search-match:active{background:var(--urbz-surface-2)!important}
.sheet .positive{color:#75DEAA!important}
.sheet .negative{color:#FE939A!important}
.sheet .profilepic{border-color:#384655!important}
.sheet a{color:#9DC9FF}\n
/* Marché et patrimoine : une pastille discrète, identique à la fiche bâtiment. */
.sheet .listitem .minicolor{
  width:12px!important;height:12px!important;min-width:12px!important;
  border-radius:50%!important;flex:0 0 12px!important;
  box-shadow:none!important;
}
.sheet .listitem{gap:13px!important}

/* Espacement réel : les trois centres sont séparés de D + G,
   en tenant compte du centrage vertical du bouton Recherche
   dans une ligne de barre supérieure de 54 px. */
.righttools{
 top:calc(env(safe-area-inset-top) + 14px + (54px - var(--urbz-control-size))/2 + var(--urbz-control-size) + var(--urbz-control-gap))!important;
 gap:var(--urbz-control-gap)!important;
}
@media(min-width:650px){
 .righttools{
  top:calc(37px + (54px - var(--urbz-control-size))/2 + var(--urbz-control-size) + var(--urbz-control-gap))!important;
 }
}

/* La fiche reste un tiers de l'écran. Lorsque la courbe s'ouvre,
   son bord inférieur sert de point d'ancrage et les éléments
   précédents coulissent vers le haut dans la zone défilante. */
.sheet .sheet-scroll{scrollbar-width:none;overscroll-behavior:contain}
.sheet .sheet-scroll::-webkit-scrollbar{display:none}
.sheet .urbz-evolution{overflow:hidden}
.sheet .urbz-evolution[aria-expanded="true"] .chart,
.sheet .urbz-evolution[aria-expanded="true"] .statgrid{
 animation:urbz-chart-reveal .34s cubic-bezier(.2,.72,.25,1) both;
}
@keyframes urbz-chart-reveal{
 from{opacity:0;transform:translateY(12px)}
 to{opacity:1;transform:translateY(0)}
}



/* --- Correctifs visuels URBZ 2026-11-23 --- */
#sheet .listitem{gap:12px!important}
#sheet .listitem .minicolor{
  width:10px!important;
  height:10px!important;
  min-width:10px!important;
  flex:0 0 10px!important;
  border-radius:999px!important;
  box-shadow:none!important;
}
#sheet .listitem .desc strong{line-height:1.2}
#sheet .listitem .desc small{margin-top:3px}
/* ordre des actions à droite : recherche, marché, classement */
#openMarket .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
#openRanking .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}


/* Recherche : montrer les résultats même lorsqu'il n'y en a qu'un seul. */
.sheet.searchsheet.has-search-results,
.sheet.searchsheet.has-search-results.full,
.sheet.searchsheet.has-search-results.navsheet{
 height:min(42dvh,360px)!important;
 max-height:min(42dvh,360px)!important;
 min-height:0!important;
}
.sheet.searchsheet.has-search-results .sheet-scroll{
 display:flex!important;
 flex-direction:column!important;
 min-height:0!important;
 overflow:hidden!important;
}
.sheet.searchsheet.has-search-results .search-results{
 display:block!important;
 overflow-y:auto!important;
 min-height:0!important;
 flex:1 1 auto!important;
}
.sheet.searchsheet .search-match{cursor:pointer}
.sheet.searchsheet .search-match:focus-visible{outline:2px solid #9BC3FF;outline-offset:-2px}
@media(min-width:650px){
 .sheet.searchsheet.has-search-results,.sheet.searchsheet.has-search-results.full,.sheet.searchsheet.has-search-results.navsheet{
  height:min(42%,360px)!important;max-height:min(42%,360px)!important;
 }
}

/* Fiche bâtiment — expansion verticale bidirectionnelle, ancrée en bas. */
.sheet.building-sheet,.sheet.building-sheet.compact,.sheet.building-sheet.full{
 height:33.333%!important;max-height:89%!important;min-height:0!important;
 transition:height .48s cubic-bezier(.23,.8,.24,1),transform .42s cubic-bezier(.2,.83,.15,1)!important;
}
.sheet.building-sheet.building-expanded,.sheet.building-sheet.building-expanded.compact{
 height:var(--building-expanded-height,78%)!important;
 max-height:89%!important;
}
.sheet.building-sheet.no-building-transition{transition:none!important}
.sheet.building-sheet .sheet-content{min-height:0!important}
.sheet.building-sheet .sheet-scroll{
 display:flex!important;flex-direction:column!important;justify-content:flex-end!important;
 overflow-y:auto!important;padding-bottom:17px!important;min-height:0!important;
}
.sheet.building-sheet .building-header{position:relative!important;top:auto!important;flex-shrink:0}
.sheet.building-sheet .urbz-value,.sheet.building-sheet .urbz-evolution,
.sheet.building-sheet .building-trade{flex-shrink:0}
.sheet.building-sheet .urbz-evolution{transition:padding .4s ease;border-radius:22px;}
.sheet.building-sheet .urbz-evolution-details{
 max-height:0;opacity:0;overflow:hidden;
 transition:max-height .48s cubic-bezier(.23,.8,.24,1),opacity .34s ease;
}
.sheet.building-sheet.building-expanded .urbz-evolution-details{max-height:500px;opacity:1}
.sheet.building-sheet .urbz-evolution-inner{padding-top:9px;padding-bottom:4px}
.sheet.building-sheet .urbz-evolution .chart{height:110px;max-width:100%}
.sheet.building-sheet .urbz-evolution .statgrid{margin-top:12px}
.sheet.building-sheet .urbz-evolution .stat{min-height:109px;padding:12px 11px}
.sheet.building-sheet .urbz-evolution .stat .big{font-size:20px;margin:9px 0 1px}
.sheet.building-sheet .urbz-evolution .stat p{font-size:10px}
@media(min-width:650px){
 .sheet.building-sheet,.sheet.building-sheet.compact{height:33.333%!important;max-height:89%!important}
 .sheet.building-sheet.building-expanded{height:var(--building-expanded-height,78%)!important;max-height:89%!important}
}
@media(prefers-reduced-motion:reduce){.sheet.building-sheet,.sheet.building-sheet .urbz-evolution-details{transition-duration:.01ms!important}}

/* Fiche bâtiment : le nom et la famille restent toujours visibles,
   même lorsque la courbe pousse la fiche vers le haut. */
.sheet.building-sheet .fixed-sheet-title.building-header{
  flex:0 0 auto!important;
  position:relative!important;
  top:auto!important;
  z-index:8!important;
  margin:0!important;
  padding:12px 2px 13px!important;
  min-height:60px!important;
  background:var(--urbz-panel,#141A20)!important;
  border:0!important;
  border-bottom:1px solid var(--urbz-border,#28323D)!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
}
.sheet.building-sheet .fixed-sheet-title.building-header .headcopy h2{
  color:var(--urbz-text,#F5F7FA)!important;
  overflow-wrap:anywhere;
}
.sheet.building-sheet .sheet-scroll{
  min-height:0!important;
  overscroll-behavior:contain;
  scroll-padding-top:12px;
}

/* Carte principale toujours nette : aucun voile ni flou à l'ouverture */
#phone #veil,
#phone #veil.visible,
#phone #veil.map-open{
 background:transparent!important;
 background-image:none!important;
 -webkit-backdrop-filter:none!important;
 backdrop-filter:none!important;
 filter:none!important;
 opacity:0!important;
 transition:none!important;
 pointer-events:none!important;
}
#phone #veil.visible{pointer-events:none!important}
/* Recherche : trajectoire unique sans effet de rebond et hauteur stable */
#phone .sheet.searchsheet{
 height:126px!important;
 max-height:126px!important;
 min-height:126px!important;
 transition:transform .42s cubic-bezier(.2,.83,.15,1),height .32s cubic-bezier(.22,.74,.27,1),max-height .32s cubic-bezier(.22,.74,.27,1)!important;
 will-change:transform,height;
}
#phone .sheet.searchsheet.has-search-results,
#phone .sheet.searchsheet.has-search-results.full,
#phone .sheet.searchsheet.has-search-results.navsheet{
 height:var(--urbz-search-results-height,310px)!important;
 max-height:var(--urbz-search-results-height,310px)!important;
 min-height:126px!important;
}
#phone .sheet.searchsheet .sheet-content{min-height:0!important}
#phone .sheet.searchsheet .sheet-scroll{min-height:0!important}
@media (prefers-reduced-motion:reduce){
 #phone .sheet.searchsheet{transition-duration:.01ms!important}
}


/* Les panneaux secondaires ne neutralisent jamais la navigation sur la carte. */
#phone #veil,#phone #veil.visible,#phone #veil.map-open{pointer-events:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:transparent!important;opacity:0!important}
#phone .sheet.visible{pointer-events:auto;}
.circ.on{background:#171b1d;color:#fff}.circ,.btn{transition:transform .28s cubic-bezier(.34,1.8,.5,1)}.circ:active,.btn:active{transform:scale(.84)}@media(hover:hover){.circ:hover{transform:scale(1.1) rotate(-4deg)}}@keyframes cf{0%{transform:translate(0,0) scale(.3) rotate(0)}100%{transform:translate(var(--x),calc(var(--y) + 260px)) scale(1) rotate(540deg);opacity:0}}#legend{position:fixed;z-index:5;left:14px;top:calc(env(safe-area-inset-top) + 113px);padding:9px 12px;border-radius:18px;background:#ffffffe8;box-shadow:0 6px 20px #1f2c3026;font:700 10.5px 'Montserrat Alternates',sans-serif;pointer-events:none}#legend .lgrow{display:flex;align-items:center;gap:7px;margin:5px 0;justify-content:space-between}#legend i{width:12px;height:12px;border-radius:50%;flex:none}#legend .lgbar{height:8px;border-radius:6px;margin:7px 0;background:linear-gradient(90deg,#eef2f6,#a9d9c0,#e9c46a,#e76f51)}
/* ===== Thème JEU : contours épais, boutons « chunky », couleurs bonbon, rebonds ===== */
:root{--ol:#2A1466;--gold:#FFD43B}
html,body,button,input,select{font-family:'Fredoka','Montserrat Alternates',sans-serif!important;font-weight:600}
.sheet h1,.sheet h2,.sheet h3,.price,.btn,#toast,.top-title strong{font-family:'Lilita One','Fredoka',sans-serif!important;font-weight:400!important;letter-spacing:.4px}
.circ{border:3px solid var(--ol)!important;box-shadow:0 5px 0 var(--ol),0 10px 18px #2a14664d!important;color:#fff!important;transition:transform .2s cubic-bezier(.34,1.8,.5,1),box-shadow .2s!important}
.circ .material-symbols-rounded{color:#fff;font-size:26px;text-shadow:0 2px 0 #00000040}
.circ:active{transform:translateY(4px) scale(.96)!important;box-shadow:0 1px 0 var(--ol)!important}
@media(hover:hover){.circ:hover{transform:translateY(-2px) scale(1.08) rotate(0)!important}}
#openSearch{background:linear-gradient(180deg,#FFE066,#FFB000)!important}
#openMarket{background:linear-gradient(180deg,#7CFF8A,#1FC95A)!important}
#openRanking{background:linear-gradient(180deg,#FF9E6B,#FF5A36)!important}
#toggleMarketView{background:linear-gradient(180deg,#FF8FC7,#E8359E)!important}
#gps{background:linear-gradient(180deg,#6FD6FF,#1292F0)!important}
.circ.on{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ol),0 0 26px 6px #ff8fc799!important}
.profilepic{border:4px solid var(--gold)!important;box-shadow:0 5px 0 var(--ol),0 0 0 3px var(--ol)!important}
.sheet{background:linear-gradient(180deg,#7446F0 0%,#45229F 100%)!important;backdrop-filter:none!important;border:4px solid var(--ol)!important;box-shadow:0 -8px 0 #0000001f,0 -18px 60px #2a146699!important;color:#fff!important}
.sheet-content,.sheet-content *{color:inherit}
.sheet .muted,.sheet .price-label,.sheet .stat p{color:#D9CCFF!important}
.sheet .sheet-heading h2,.sheet .headcopy h2{font-size:26px;text-shadow:0 3px 0 var(--ol)}
.sheet .price{color:var(--gold)!important;font-size:42px;letter-spacing:0;text-shadow:0 4px 0 var(--ol)}
.sheet .positive{color:#6BFFA0!important;font-weight:700}.sheet .negative{color:#FF8C9A!important;font-weight:700}
.sheet .elevated,.sheet .urbz-evolution{background:linear-gradient(180deg,#8A5CFF,#6A3DE0)!important;border:3px solid var(--ol)!important;border-radius:22px!important;box-shadow:0 5px 0 var(--ol)!important;color:#fff!important}
.sheet .listitem{background:#ffffff22!important;border:3px solid #2a146699!important;border-radius:18px!important;margin:0 0 8px!important;width:100%!important;color:#fff!important}
.sheet .pill{background:#fff!important;color:var(--ol)!important;border:3px solid var(--ol)!important;box-shadow:0 3px 0 var(--ol)!important}
.sheet .pill.active,.sheet .pill[aria-pressed=true]{background:var(--gold)!important}
.sheet input{background:#fff!important;color:var(--ol)!important;border:3px solid var(--ol)!important;border-radius:18px!important}
.btn{border:3px solid var(--ol)!important;border-radius:22px!important;font-size:19px!important;min-height:56px;color:#fff!important;text-shadow:0 2px 0 #00000040;box-shadow:0 6px 0 var(--ol),inset 0 3px 0 #ffffff66!important;transition:transform .2s cubic-bezier(.34,1.8,.5,1),box-shadow .2s!important}
.btn.blue{background:linear-gradient(180deg,#7CFF6B,#22C74A)!important}
.btn.red{background:linear-gradient(180deg,#FF8A7A,#F03A4F)!important}
.btn:active{transform:translateY(5px) scale(.98)!important;box-shadow:0 1px 0 var(--ol),inset 0 3px 0 #ffffff66!important}
#toast{background:var(--gold)!important;color:var(--ol)!important;border:3px solid var(--ol)!important;box-shadow:0 5px 0 var(--ol)!important;border-radius:20px!important}
#legend,.map-hint{background:#fff!important;color:var(--ol)!important;border:3px solid var(--ol)!important;box-shadow:0 4px 0 var(--ol)!important}
@keyframes popin{0%{transform:scale(.8) translateY(14px);opacity:0}70%{transform:scale(1.04)}100%{transform:none;opacity:1}}
.sheet.visible .elevated,.sheet.visible .btn,.sheet.visible .listitem,.sheet.visible .urbz-evolution{animation:popin .5s cubic-bezier(.34,1.56,.5,1) both}
/* ===== Barre d'onglets (inspirée des jeux de cartes/collection), HUD, nuages ===== */
#phone .righttools{position:absolute!important;left:50%!important;right:auto!important;top:auto!important;bottom:calc(env(safe-area-inset-bottom) + 12px)!important;transform:translateX(-50%);flex-direction:row!important;gap:12px!important;padding:9px 16px 25px;background:linear-gradient(180deg,#6A3DE8,#3F1F95);border:3px solid var(--ol);border-radius:30px;box-shadow:0 6px 0 var(--ol),0 14px 30px #2a146666;z-index:8}
#phone .righttools .circ{width:56px!important;height:56px!important;position:relative;overflow:visible}
.righttools .lbl{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font:400 11.5px 'Lilita One',sans-serif;color:#fff;text-shadow:0 2px 0 var(--ol);white-space:nowrap;pointer-events:none}
#openMarket{order:1}#openWallet{order:2}#openRanking{order:3}#toggleMarketView{order:4}
#openWallet{background:linear-gradient(180deg,#6BF0DA,#0FB39E)!important}
#phone .bottomtools{bottom:calc(env(safe-area-inset-bottom) + 116px)!important;right:14px!important}
#phone .map-hint{bottom:calc(env(safe-area-inset-bottom) + 122px)!important}
.top-title{text-shadow:none!important;display:flex;flex-direction:column;align-items:center;gap:5px}
.pill-hud{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ol);border-radius:999px;box-shadow:0 4px 0 var(--ol);padding:3px 15px 3px 3px;font:400 17px 'Lilita One',sans-serif;color:var(--ol)}
.pill-hud .coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A8,#FFB000);border:2px solid var(--ol);display:grid;place-items:center;font-style:normal;font-size:14px}
.top-title small{font:400 11px 'Lilita One',sans-serif;color:#fff;background:var(--ol);padding:2px 10px;border-radius:999px;letter-spacing:.3px}
#clouds{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#clouds i{position:absolute;left:-60%;width:55%;height:74px;border-radius:50%;background:radial-gradient(closest-side,#fff 0,#ffffffbb 55%,#fff0 100%);opacity:.55;filter:blur(2px);animation:cloud 46s linear infinite}
#clouds i:nth-child(1){top:16%}#clouds i:nth-child(2){top:41%;animation-delay:-14s;animation-duration:58s}#clouds i:nth-child(3){top:64%;animation-delay:-28s}#clouds i:nth-child(4){top:82%;animation-delay:-40s;animation-duration:64s}
@keyframes cloud{to{transform:translateX(480%)}}
#legend i{border:2px solid var(--ol)}
/* ===== Île flottante / marqueurs / XP / bouton lumineux ===== */
.mk{position:absolute;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 0 #2a146655)}
.mk.unk .q{display:grid;place-items:center;width:46px;height:52px;background:#1B2B57;border:3px solid #fff;border-radius:16px 16px 16px 16px;color:#fff;font:400 28px 'Lilita One',sans-serif;text-shadow:0 2px 0 #0008}
.mk.unk .q:after{content:'';position:absolute;bottom:-9px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.mk.own{flex-direction:row;gap:6px;align-items:center;background:#fff;border:3px solid var(--ol);border-radius:999px;padding:3px 12px 3px 3px;box-shadow:0 4px 0 var(--ol)}
.mk.own .coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A8,#FFB000);border:2px solid var(--ol);display:grid;place-items:center;font:400 13px 'Lilita One';color:var(--ol)}
.mk.own b{font:400 14px 'Lilita One',sans-serif;color:var(--ol);white-space:nowrap}
.mk.sel{animation:bob 1s ease-in-out infinite;transform:scale(1.2)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
.xp{display:flex;align-items:center;gap:6px;width:150px}
.xp em{font:400 12px 'Lilita One';font-style:normal;color:#fff;background:var(--ol);border-radius:999px;padding:2px 9px;white-space:nowrap}
.xp span{flex:1;height:12px;background:#2a146699;border:2px solid var(--ol);border-radius:999px;overflow:hidden}
.xp u{display:block;height:100%;background:linear-gradient(180deg,#9BFF6B,#2ED84F);border-radius:999px;transition:width .6s cubic-bezier(.34,1.56,.5,1)}

function renderSheet(){
 const content=$('sheetContent');
 content.innerHTML=view==='building'?renderBuilding():view==='market'?renderMarket():view==='profile'?renderProfile():view==='wallet'?renderWallet():view==='ranking'?renderRanking():view==='search'?renderSearch():'';
 const title=content.querySelector('.sheet-heading');
 if(title)title.classList.add('fixed-sheet-title');
 const filter=(view==='market')?content.querySelector('.pillrow'):null;
 if(filter)filter.classList.add('market-floating-filters');
 const scroll=document.createElement('div');scroll.className='sheet-scroll';
 for(const node of [...content.childNodes])if(node!==title&&node!==filter)scroll.appendChild(node);
 content.appendChild(scroll);
 if(filter)content.appendChild(filter);
 attachSheetActions();
}

// Le bord inférieur du cartouche reste ancré : la fiche grandit vers le haut.
// Aucun remplacement DOM lors du clic : les deux mouvements sont réversibles.
function setBuildingExpansion(open,animate=true){
 if(view!=='building')return;
 const sheet=$('sheet');
 const button=$('expandBtn');
 const details=$('evolutionDetails');
 if(!button||!details)return;
 const scroll=$('sheetContent').querySelector('.sheet-scroll');
 const chevron=$('evolutionChevron');
 const deviceHeight=$('phone')?.getBoundingClientRect().height||window.innerHeight;
 // Compensation de l'espace qu'occupent la courbe et les deux indicateurs.
 // On garde toujours la base du panneau au bas de l'écran.
 const normalHeight=deviceHeight/3;
 const additionalHeight=details.scrollHeight+18;
 // L'en-tête est désormais fixe et ne fait plus partie de la zone défilante.
 // On réserve la place nécessaire pour le garder visible avec la valeur,
 // le graphique, les deux indices et l'action d'achat/revente.
 const heading=$('sheetContent').querySelector('.building-header');
 const headerHeight=heading?.getBoundingClientRect().height||72;
 const collapsedContentHeight=scroll?scroll.scrollHeight:normalHeight;
 const requiredHeight=headerHeight+collapsedContentHeight+additionalHeight+30;
 const expandedHeight=Math.min(deviceHeight*.92,Math.max(normalHeight+additionalHeight+headerHeight,requiredHeight));
 sheet.style.setProperty('--building-expanded-height',expandedHeight+'px');
 button.setAttribute('aria-expanded',String(open));
 if(chevron)chevron.textContent=open?'expand_less':'expand_more';
 if(animate===false){sheet.classList.add('no-building-transition')}
 sheet.classList.toggle('building-expanded',open);
 if(scroll){
   // Ne jamais faire défiler jusqu'en bas : cela cachait le nom du bâtiment.
   // L'agrandissement du panneau absorbe le contenu. Le défilement reste
   // manuel uniquement si l'écran du téléphone est trop petit.
   scroll.scrollTop=0;
 }
 if(!animate)requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.remove('no-building-transition')));
}
function attachSheetActions(){const c=$('sheetContent');
 c.querySelector('#toggleMyBuildings')?.addEventListener('click',()=>{showMyBuildings=!showMyBuildings;try{localStorage.setItem('urbz-mes-batiments-actif-v1',JSON.stringify(showMyBuildings))}catch{};paint();renderSheet()});
 c.querySelector('#closeSheet')?.addEventListener('click',()=>{if(view==='building'){selectedId=null;persist();paint()}closeSheet()});
 c.querySelector('#expandBtn')?.addEventListener('click',()=>{
  expanded=!expanded;
  setBuildingExpansion(expanded,true);
 });
 c.querySelector('#tradeBtn')?.addEventListener('click',()=>{if(!selectedId)return;const price=currentValue(selectedId);if(ownerFor(selectedId)){economy.balance+=price;delete economy.owned[selectedId];toast('Vente enregistrée : +'+money(price))}else{if(economy.balance<price){toast('Crédits insuffisants.',5);return}economy.balance-=price;economy.owned[selectedId]={boughtAt:price,turn:economy.turn};toast('Bâtiment acheté · '+money(price))}saveEconomy();renderSheet()});
 c.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{const id=b.dataset.filter;if(marketFilters.has(id))marketFilters.delete(id);else marketFilters.add(id);c.querySelectorAll('[data-filter]').forEach(p=>{const active=marketFilters.has(p.dataset.filter);p.classList.toggle('active',active);p.setAttribute('aria-pressed',String(active))});const list=c.querySelector('.sheet-scroll .list')||c.querySelector('.list');if(list)list.innerHTML=marketRows()});
 c.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
 c.querySelectorAll('[data-building]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.building;
  const group=buildings.get(id);
  // Same animated journey as tapping a search result.
  const point=group?buildingMidpoint(group):cachedPositionForBuilding(id);
  if(!point){toast('La position de ce bâtiment n’est pas encore disponible.',4);return}
  travelToBuilding({id,key:knownKind(id)||cardRecords[id]?.kind||null,point,name:kindName(id),category:categoryOf(id)});
 });
 c.querySelector('#searchInput')?.addEventListener('input',e=>scheduleBuildingSearch(e.target.value));
 c.querySelector('#searchInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitBuildingSearch()}});
}
